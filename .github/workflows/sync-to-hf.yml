# Copies this repository to a Hugging Face Space on every push to main.
#
# One-time setup in GitHub (Settings → Secrets and variables → Actions):
#   Variables tab: HF_SPACE = <hf-username>/<space-name>
#   Secrets tab:   HF_TOKEN = a Hugging Face access token with "write" permission
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      # Push a single-commit snapshot of the current code, not the full history:
      # Spaces reject binary files (like the PDF in attached_assets/) unless they
      # are stored with LFS, and the app doesn't need them.
      - name: Push snapshot to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a HF_TOKEN repository secret (Hugging Face token with write access)."
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-snapshot
          git rm -r -q --cached attached_assets .github .replit replit.md 2>/dev/null || true
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-snapshot:main
